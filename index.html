<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CCAO-F Practice Quiz</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<meta name="theme-color" content="#6b2a84">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="description" content="Interactive practice quiz for the Claude Certified Associate – Foundations (CCAO-F) exam.">
<style>
:root{
  --bg:#f7f6fb;--card:#fff;--ink:#1f2937;--muted:#6b7280;--line:#e5e7eb;
  --brand:#6b2a84;--brand-soft:#f1e8f6;--ok:#15803d;--ok-bg:#e8f6ec;--bad:#b91c1c;--bad-bg:#fcebea;--warn:#b45309;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#14121a;--card:#1d1a25;--ink:#ece9f2;--muted:#9a95a8;--line:#322d3f;
  --brand:#c58ae0;--brand-soft:#2b2136;--ok:#4ade80;--ok-bg:#12281a;--bad:#f87171;--bad-bg:#2c1717;--warn:#fbbf24}
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
.wrap{max-width:760px;margin:0 auto;padding:20px 16px 60px}
h1{font-size:1.6rem;margin:.2em 0}
h2{font-size:1.15rem;margin:1.4em 0 .5em}
.sub{color:var(--muted);margin:0 0 1.2em}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px;margin-bottom:14px}
button{font:inherit;cursor:pointer}
.btn{background:var(--brand);color:#fff;border:0;border-radius:8px;padding:10px 18px;font-weight:600}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--brand);border:1px solid var(--brand)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grow{flex:1}
.mode{display:block;width:100%;text-align:left;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:10px}
.mode:hover{border-color:var(--brand)}
.mode b{display:block}
.mode span{color:var(--muted);font-size:.9rem}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px;font-size:.9rem;color:var(--muted)}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-bottom:16px}
.bar i{display:block;height:100%;background:var(--brand);transition:width .2s}
.tag{display:inline-block;font-size:.78rem;background:var(--brand-soft);color:var(--brand);border-radius:99px;padding:2px 10px;margin-right:6px}
.q{font-size:1.08rem;margin:.6em 0 1em}
ol.steps{margin:0 0 1em;padding-left:1.4em}
.opt{display:flex;gap:12px;width:100%;text-align:left;background:var(--card);color:var(--ink);border:1.5px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:9px}
.opt:hover:not(:disabled){border-color:var(--brand)}
.opt .k{font-weight:700;color:var(--brand);min-width:1.2em}
.opt.sel{border-color:var(--brand);background:var(--brand-soft)}
.opt.ok{border-color:var(--ok);background:var(--ok-bg)}
.opt.bad{border-color:var(--bad);background:var(--bad-bg)}
.opt.miss{border-color:var(--ok);border-style:dashed}
.opt:disabled{cursor:default}
.fb{border-left:4px solid var(--brand);padding:2px 14px;margin:14px 0}
.fb.ok{border-color:var(--ok)}.fb.bad{border-color:var(--bad)}
.fb h3{margin:.3em 0;font-size:1rem}
.fb small{display:block;color:var(--muted);font-style:italic;margin-top:.6em}
.score{font-size:2.6rem;font-weight:800;margin:.1em 0}
.pass{color:var(--ok)}.fail{color:var(--bad)}
table{width:100%;border-collapse:collapse;font-size:.92rem}
td,th{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left}
td.n,th.n{text-align:right;white-space:nowrap}
.dbar{height:8px;background:var(--line);border-radius:4px;min-width:80px}
.dbar i{display:block;height:100%;border-radius:4px;background:var(--brand)}
.rev{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
.dot{width:34px;height:34px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:.8rem;font-weight:600}
.dot.done{background:var(--brand-soft);border-color:var(--brand)}
.dot.cur{outline:2px solid var(--brand)}
.dot.ok{background:var(--ok-bg);border-color:var(--ok)}
.dot.bad{background:var(--bad-bg);border-color:var(--bad)}
.dot.flag{box-shadow:inset 0 -4px 0 var(--warn)}
.clockbox{font-size:.95rem}.clockbox b{font-variant-numeric:tabular-nums;font-size:1.1rem;color:var(--ink)}.clockbox b.low{color:var(--bad)}
ul.rules{padding-left:1.2em;margin:0 0 16px}ul.rules li{margin-bottom:6px}
.dot.part{border-style:dashed;border-color:var(--warn)}
.tag.flagtag{background:#fdecc8;color:#7a4a00}
details>summary{cursor:pointer}
button{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.opt{min-height:52px;align-items:center}
.actions{position:sticky;bottom:0;background:var(--card);padding:10px 0 calc(10px + env(safe-area-inset-bottom));margin-top:10px;border-top:1px solid var(--line)}
.hero{background:var(--brand);color:#fff;border:0}.hero b{font-size:1.1rem}.hero span{color:#f1e8f6}
.hist td{font-size:.88rem}
.tag.speed{background:#fff1c9;color:#7a4a00}
@media (max-width:480px){.wrap{padding:14px 12px 40px}.topbar{flex-wrap:wrap}}
footer{margin-top:30px;color:var(--muted);font-size:.82rem;text-align:center}
footer a{color:var(--brand)}
.note{font-size:.85rem;color:var(--muted)}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script src="questions.js"></script>
<script>
(function(){
const Q = window.QUESTIONS, D = window.DOMAINS;
const app = document.getElementById('app');
const KEY = 'ccaof-quiz-v1';
const EXAM_SECS = 120*60;
const SPEED_N = 10, SPEED_SECS = Math.round(EXAM_SECS/Q.length)*SPEED_N; // 2 min per question -> 20:00
const HKEY='ccaof-history-v1', QKEY='ccaof-qstats-v1';
const jget=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))||d}catch(e){return d}};
const jset=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
const PASS = 0.75;
let S = null;       // current session
let tick = null;

const el = (h)=>{const t=document.createElement('template');t.innerHTML=h.trim();return t.content.firstChild};
const esc = s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function load(){try{return JSON.parse(localStorage.getItem(KEY))}catch(e){return null}}
function clear(){try{localStorage.removeItem(KEY)}catch(e){}}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
const need = q=>q.a.length;
const isMulti = q=>q.a.length>1;
function correct(q,sel){return sel&&sel.length===q.a.length&&q.a.every(x=>sel.includes(x))}

/* ---------- home / instructions ---------- */
function progressHTML(){
  const hist=jget(HKEY,[]), qs=jget(QKEY,{});
  if(!hist.length) return '';
  const dm=Object.keys(D).map(k=>{
    let n=0,c=0;Q.filter(q=>q.d==k).forEach(q=>{const t=qs[q.id];if(t){n+=t.seen;c+=t.seen-t.wrong}});
    const p=n?c/n:null;
    return `<tr><td>${k}. ${esc(D[k])}</td><td class="n">${p==null?'–':Math.round(p*100)+'%'}</td><td style="width:70px"><div class="dbar"><i style="width:${(p||0)*100}%;background:${p!=null&&p<PASS?'var(--bad)':'var(--ok)'}"></i></div></td></tr>`}).join('');
  const rows=hist.slice(-6).reverse().map(r=>`<tr><td>${new Date(r.t).toLocaleDateString(undefined,{month:'short',day:'numeric'})}</td><td>${esc(r.label)}</td><td class="n"><b>${Math.round(r.c/r.n*100)}%</b> (${r.c}/${r.n})</td></tr>`).join('');
  const seen=Object.keys(qs).length;
  return `<h2>Your progress</h2><div class="card hist"><div class="note">${hist.length} session${hist.length>1?'s':''} · ${seen}/${Q.length} questions seen · saved on this device</div>
    <table style="margin-top:8px"><tr><th>All-time accuracy by domain</th><th class="n"></th><th></th></tr>${dm}</table>
    <table style="margin-top:12px">${rows}</table>
    <div style="margin-top:10px"><button class="btn ghost" id="clearhist">Clear saved results</button></div></div>`;
}
function home(){
  clearInterval(tick);
  const saved = load();
  app.innerHTML = '';
  const dom = Object.keys(D).map(k=>`<button class="mode" data-m="d${k}"><b>Domain ${k}: ${esc(D[k])}</b><span>${Q.filter(q=>q.d==k).length} questions · instant feedback · untimed</span></button>`).join('');
  const inprog = saved&&!saved.done;
  const h = el(`<div>
    <h1>Claude Certified Associate – Foundations</h1>
    <p class="sub">CCAO-F practice</p>
    ${inprog?`<div class="card"><b>${esc(saved.label)} in progress</b><div class="note">${Object.keys(saved.ans).length} of ${saved.ids.length} answered${saved.limit?' · '+fmt(Math.max(0,saved.limit-(saved.elapsed||0)))+' left':''}</div><div class="row" style="margin-top:10px"><button class="btn" id="resume">Resume</button><button class="btn ghost" id="discard">Abandon</button></div></div>`:''}
    <button class="mode hero" data-m="speed"><b>⚡ Speed round</b><span>${SPEED_N} questions · ${fmt(SPEED_SECS)} (2 min each, same pace as the exam) · instant feedback. Favors questions you haven’t seen or missed.</span></button>
    <div class="card">
      <h2 style="margin-top:0">Full practice exam</h2>
      <ul class="rules">
        <li><b>60 questions</b> across all seven domains in blueprint proportions, mixed order.</li>
        <li><b>120 minutes</b>; auto-submits at zero. No feedback until you submit.</li>
        <li>Change answers and <b>mark for review</b> before submitting. Aim for ~<b>75%</b> in every domain.</li>
      </ul>
      <button class="btn" id="begin">Begin exam</button>
    </div>
    <details class="card"><summary><b>Study mode</b> <span class="note">· by domain, untimed</span></summary><div style="margin-top:12px">${dom}</div></details>
    ${progressHTML()}
    <footer>Questions &amp; rationales by <a href="https://linkedin.com/in/purcellmatthew" target="_blank" rel="noopener">Matthew Purcell</a>, written against Exam Guide v1.0 (July 2026). Original practice items, not actual exam content.<br>Progress and results are cached on this device and the app works offline once loaded.</footer>
  </div>`);
  app.appendChild(h);
  const go=m=>{ if(inprog&&!confirm('This replaces your session in progress. Continue?'))return; start(m)};
  h.querySelectorAll('.mode').forEach(b=>b.onclick=()=>go(b.dataset.m));
  h.querySelector('#begin').onclick=()=>go('exam');
  const r=h.querySelector('#resume'); if(r) r.onclick=()=>{S=saved;S.limit=S.limit||(S.exam?EXAM_SECS:null);S.mode=S.mode||(S.exam?'exam':'study');S.t0=Date.now()-(S.elapsed||0)*1000;S.review=false;render()};
  const d=h.querySelector('#discard'); if(d) d.onclick=()=>{if(confirm('Abandon this session?')){clear();home()}};
  const c=h.querySelector('#clearhist'); if(c) c.onclick=()=>{if(confirm('Delete all saved results and question stats?')){try{localStorage.removeItem(HKEY);localStorage.removeItem(QKEY)}catch(e){}home()}};
}

function pickSpeed(){
  const qs=jget(QKEY,{});
  const pool=Q.map(q=>{const t=qs[q.id];let w=!t?3:(t.lastWrong?4:1);return {q,w}});
  const out=[];
  while(out.length<SPEED_N&&pool.length){
    const tot=pool.reduce((a,x)=>a+x.w,0);let r=Math.random()*tot,i=0;
    for(;i<pool.length-1;i++){r-=pool[i].w;if(r<0)break}
    out.push(pool.splice(i,1)[0].q);
  }
  return out;
}

function start(m){
  let qs,label,mode,limit=null;
  if(m==='exam'){qs=shuffle(Q);label='Practice exam';mode='exam';limit=EXAM_SECS}
  else if(m==='speed'){qs=pickSpeed();label='Speed round';mode='speed';limit=SPEED_SECS}
  else {const k=m.slice(1);qs=Q.filter(q=>q.d==k);label='Domain '+k+' study';mode='study'}
  S={ids:qs.map(q=>q.id),i:0,ans:{},flag:{},exam:mode==='exam',mode,limit,label,done:false,elapsed:0,t0:Date.now(),checked:{},review:false,showKey:false};
  save();render();
}

/* ---------- exam / study screen ---------- */
function timeLeft(){return Math.max(0,S.limit-Math.floor((Date.now()-S.t0)/1000))}
function fmt(s){const h=Math.floor(s/3600),m=Math.floor(s%3600/60);return (h?h+':'+String(m).padStart(2,'0'):m)+':'+String(s%60).padStart(2,'0')}
function startClock(clock){
  const upd=()=>{const t=timeLeft();S.elapsed=S.limit-t;if(!S.done)save();clock.textContent=fmt(t);clock.classList.toggle('low',t<(S.exam?600:120));
    if(t<=0){clearInterval(tick);alert('Time is up. Your '+(S.exam?'exam':'round')+' will now be submitted.');finish()}};
  upd();tick=setInterval(upd,1000);
}

function render(){
  if(S.done) return results();
  if(S.review) return reviewScreen();
  const q = Q.find(x=>x.id===S.ids[S.i]);
  const sel = S.ans[q.id]||[];
  const revealed = !S.exam && S.checked[q.id];
  clearInterval(tick);
  const total=S.ids.length;
  const opts = Object.entries(q.o).map(([k,t])=>{
    let c='opt';
    if(revealed){ if(q.a.includes(k)) c+= sel.includes(k)?' ok':' miss'; else if(sel.includes(k)) c+=' bad'; }
    else if(sel.includes(k)) c+=' sel';
    return `<button class="${c}" data-k="${k}" ${revealed?'disabled':''}><span class="k">${k}.</span><span>${esc(t)}</span></button>`}).join('');
  const steps = q.steps?`<ol class="steps">${q.steps.map(s=>`<li>${esc(s)}</li>`).join('')}</ol>`:'';
  const ok = correct(q,sel);
  const fb = revealed?`<div class="fb ${ok?'ok':'bad'}"><h3>${ok?'Correct':'Not quite'} — answer: ${q.a.join(', ')}</h3><div>${esc(q.w)}</div><small><b>Why not the others:</b> ${esc(q.n)}</small></div>`:'';
  const answered=Object.keys(S.ans).length;
  const last=S.i===total-1;
  app.innerHTML='';
  const h=el(`<div>
    <div class="topbar">${S.exam?'':'<button class="btn ghost" id="home">← Menu</button>'}${S.limit?'<span class="clockbox">'+(S.exam?'Time remaining ':'⏱ ')+'<b id="clock"></b></span>':''}<span>Question <b>${S.i+1}</b> of ${total}</span></div>
    <div class="bar"><i style="width:${answered/total*100}%"></i></div>
    <div class="card">
      <div><span class="tag">${isMulti(q)?'Select '+(need(q)===2?'TWO':need(q)):'Select ONE'}</span>${S.flag[q.id]?'<span class="tag flagtag">Marked for review</span>':''}${S.mode==='speed'?'<span class="tag speed">⚡ Speed</span>':''}${S.exam?'':`<span class="tag">Domain ${q.d}</span>`}</div>
      <p class="q">${esc(q.q)}</p>${steps}${opts}${fb}
      <div class="row actions">
        <button class="btn ghost" id="prev" ${S.i===0||S.mode==='speed'?'disabled':''}>Previous</button>
        <button class="btn ghost" id="flag">${S.flag[q.id]?'Unmark':'Mark for review'}</button>
        <span class="grow"></span>
        ${!S.exam&&!revealed?`<button class="btn" id="check" ${sel.length!==need(q)?'disabled':''}>Check answer</button>`
          :last?`<button class="btn" id="review">${S.exam?'Review &amp; submit':'Finish'}</button>`:`<button class="btn" id="next">Next</button>`}
      </div>
    </div>
    ${S.exam?`<div class="row"><button class="btn ghost" id="review2">Review screen</button></div>`:''}
  </div>`);
  app.appendChild(h);
  h.querySelectorAll('.opt').forEach(b=>b.onclick=()=>pick(q,b.dataset.k));
  const hm=h.querySelector('#home'); if(hm) hm.onclick=()=>{S.elapsed=Math.floor((Date.now()-S.t0)/1000);save();home()};
  h.querySelector('#prev').onclick=()=>{S.i--;save();render();window.scrollTo(0,0)};
  h.querySelector('#flag').onclick=()=>{S.flag[q.id]=!S.flag[q.id];save();render()};
  const nx=h.querySelector('#next'); if(nx) nx.onclick=()=>{S.i++;save();render();window.scrollTo(0,0)};
  const ch=h.querySelector('#check'); if(ch) ch.onclick=()=>{S.checked[q.id]=true;save();render()};
  const goRev=()=>{ if(S.exam){S.review=true;save();render()} else finish() };
  ['#review','#review2'].forEach(id=>{const b=h.querySelector(id); if(b) b.onclick=goRev});
  if(S.limit) startClock(h.querySelector('#clock'));
}

function pick(q,k){
  let sel=(S.ans[q.id]||[]).slice();
  if(isMulti(q)){
    if(sel.includes(k)) sel=sel.filter(x=>x!==k);
    else { if(sel.length>=need(q)) sel.shift(); sel.push(k); }
  } else sel=[k];
  if(sel.length) S.ans[q.id]=sel; else delete S.ans[q.id];
  save();render();
}

/* ---------- review screen (exam only) ---------- */
function reviewScreen(){
  clearInterval(tick);
  const total=S.ids.length;
  const unans=S.ids.filter(id=>!S.ans[id]).length;
  const incomplete=S.ids.filter(id=>S.ans[id]&&S.ans[id].length!==need(Q.find(q=>q.id===id))).length;
  const flagged=S.ids.filter(id=>S.flag[id]).length;
  const dots=S.ids.map((id,idx)=>{
    const q=Q.find(x=>x.id===id);let c='dot';
    if(S.ans[id]) c+= S.ans[id].length===need(q)?' done':' part';
    if(S.flag[id]) c+=' flag';
    return `<button class="${c}" data-j="${idx}" aria-label="Question ${idx+1}">${idx+1}</button>`}).join('');
  app.innerHTML='';
  const h=el(`<div>
    <div class="topbar"><span class="clockbox">Time remaining <b id="clock"></b></span><span>Review</span></div>
    <div class="card">
      <h2 style="margin-top:0">Review your answers</h2>
      <p><b>${total-unans}</b> of ${total} answered · <b class="${unans?'fail':'pass'}">${unans}</b> unanswered${incomplete?` · <b class="fail">${incomplete}</b> incomplete`:''} · <b>${flagged}</b> marked for review</p>
      <div class="rev">${dots}</div>
      <div class="legend note">Filled = answered · outlined = unanswered · orange underline = marked for review · dashed = incomplete selection</div>
      <div class="row" style="margin-top:14px">
        <button class="btn ghost" id="back">Back to exam</button>
        <button class="btn ghost" id="nextflag" ${flagged?'':'disabled'}>Go to first marked</button>
        <button class="btn ghost" id="nextun" ${unans?'':'disabled'}>Go to first unanswered</button>
        <span class="grow"></span>
        <button class="btn" id="submit">Submit exam</button>
      </div>
    </div></div>`);
  app.appendChild(h);
  const go=i=>{S.i=i;S.review=false;save();render();window.scrollTo(0,0)};
  h.querySelectorAll('.dot').forEach(b=>b.onclick=()=>go(+b.dataset.j));
  h.querySelector('#back').onclick=()=>go(S.i);
  h.querySelector('#nextflag').onclick=()=>go(S.ids.findIndex(id=>S.flag[id]));
  h.querySelector('#nextun').onclick=()=>go(S.ids.findIndex(id=>!S.ans[id]));
  h.querySelector('#submit').onclick=()=>{
    if(confirm(unans?`${unans} question(s) are unanswered. Submit and end the exam?`:'Submit your exam? You will not be able to change your answers.')) finish()};
  startClock(h.querySelector('#clock'));
}

function record(){
  const qs=S.ids.map(id=>Q.find(q=>q.id===id)),per={};let c=0;
  const st=jget(QKEY,{});
  qs.forEach(q=>{const ok=correct(q,S.ans[q.id]);per[q.d]=per[q.d]||{n:0,c:0};per[q.d].n++;if(ok){per[q.d].c++;c++}
    // in a timed round only count questions actually reached/answered, so unseen ones stay "unseen"
    if(S.ans[q.id]||S.exam){const t=st[q.id]||{seen:0,wrong:0};t.seen++;if(!ok)t.wrong++;t.lastWrong=!ok;st[q.id]=t}});
  const h=jget(HKEY,[]);h.push({t:Date.now(),label:S.label,mode:S.mode,n:qs.length,c,per,secs:S.elapsed});
  jset(HKEY,h.slice(-100));jset(QKEY,st);
}
function finish(){S.done=true;S.review=false;S.elapsed=Math.min(S.limit||1e9,Math.floor((Date.now()-S.t0)/1000));clearInterval(tick);record();save();results()}

/* ---------- results ---------- */
function results(){
  const qs=S.ids.map(id=>Q.find(q=>q.id===id));
  const per={};let tot=0;
  qs.forEach(q=>{per[q.d]=per[q.d]||{n:0,c:0};per[q.d].n++;if(correct(q,S.ans[q.id])){per[q.d].c++;tot++}});
  const pct=tot/qs.length;
  const weak=Object.keys(per).filter(k=>per[k].c/per[k].n<PASS);
  const rows=Object.keys(per).map(k=>{const p=per[k].c/per[k].n;return `<tr><td>${k}. ${esc(D[k])}</td><td class="n">${Math.round(p*100)}%</td><td class="n">${per[k].c}/${per[k].n}</td><td style="width:90px"><div class="dbar"><i style="width:${p*100}%;background:${p>=PASS?'var(--ok)':'var(--bad)'}"></i></div></td></tr>`}).join('');
  const review=qs.map(q=>{
    const sel=S.ans[q.id]||[];const ok=correct(q,sel);
    const opts=Object.entries(q.o).map(([k,t])=>{let c='opt';if(q.a.includes(k))c+=sel.includes(k)?' ok':' miss';else if(sel.includes(k))c+=' bad';return `<div class="${c}"><span class="k">${k}.</span><span>${esc(t)}</span></div>`}).join('');
    const steps=q.steps?`<ol class="steps">${q.steps.map(s=>`<li>${esc(s)}</li>`).join('')}</ol>`:'';
    return `<details class="card" ${ok?'':'open'}><summary><b>${q.id}</b> ${ok?'✅':sel.length?'❌':'⬜ unanswered'} <span class="note">Yours: ${sel.join(', ')||'—'} · Correct: ${q.a.join(', ')}</span></summary>
      <p class="q">${esc(q.q)}</p>${steps}${opts}
      <div class="fb"><div>${esc(q.w)}</div><small><b>Why not the others:</b> ${esc(q.n)}</small></div></details>`}).join('');
  app.innerHTML='';
  const h=el(`<div>
    <h1>${S.mode==='exam'?'Exam complete':S.mode==='speed'?'Round complete':'Session complete'}</h1><p class="sub">${esc(S.label)} · time used ${fmt(S.elapsed)}</p>
    <div class="card"><div class="score ${pct>=PASS?'pass':'fail'}">${Math.round(pct*100)}%</div>
      <div><b>${pct>=PASS?'Meets':'Below'} the 75% readiness target</b> · ${tot} of ${qs.length} correct</div>
      ${weak.length?`<p class="note">Below 75% in: ${weak.map(k=>esc(D[k])).join('; ')}.</p>`:'<p class="note">At or above 75% in every domain.</p>'}
      <h2>Performance by domain</h2><table><tr><th>Domain</th><th class="n">Score</th><th class="n">Correct</th><th></th></tr>${rows}</table>
      <div class="row" style="margin-top:16px">
        <button class="btn" id="showkey">${S.showKey?'Hide':'Review'} answers &amp; rationales</button>
        ${S.mode==='speed'?'<button class="btn" id="speedagain">Another speed round</button>':''}<button class="btn ghost" id="again">Back to start</button>
        ${tot<qs.length?'<button class="btn ghost" id="retry">Retry missed (study mode)</button>':''}
      </div></div>
    ${S.showKey?`<h2>Answer review</h2>${review}`:''}
  </div>`);
  app.appendChild(h);
  h.querySelector('#showkey').onclick=()=>{S.showKey=!S.showKey;save();results()};
  h.querySelector('#again').onclick=()=>{clear();home()};
  const sa=h.querySelector('#speedagain'); if(sa) sa.onclick=()=>start('speed');
  const r=h.querySelector('#retry');
  if(r) r.onclick=()=>{const miss=qs.filter(q=>!correct(q,S.ans[q.id])).map(q=>q.id);
    S={ids:miss,i:0,ans:{},flag:{},exam:false,mode:'study',limit:null,label:'retry of missed questions',done:false,elapsed:0,t0:Date.now(),checked:{},review:false,showKey:false};save();render()};
  window.scrollTo(0,0);
}

home();
if('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(()=>{});
})();
</script>
</body>
</html>
